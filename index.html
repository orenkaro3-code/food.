<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a120d">
<title>האוכל של אורן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Assistant:wght@300;400;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
/* Layout: a printed menu at candlelight. Centered masthead, photo hero, quiet list of dishes. */
header.mast{text-align:center;padding-block:26px 18px;border-bottom:1px solid var(--line);margin-bottom:22px;display:grid;gap:10px;justify-items:center}
.mast .logo{font-size:clamp(30px,6vw,44px)}
.rule{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;letter-spacing:.32em;text-transform:uppercase}
.rule::before,.rule::after{content:"";width:40px;height:1px;background:var(--line)}
.tablechip{display:inline-flex;align-items:baseline;gap:8px;border:1px solid var(--accent);color:var(--accent2);border-radius:999px;padding:5px 16px;font-size:14px}
.tablechip b{font-family:var(--display);font-size:20px;color:var(--accent)}
/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/9;max-height:520px;width:100%;background:var(--surface)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide img,.slide .mono{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 7s ease-out}
.slide.on img{transform:scale(1)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(14,9,6,.92) 0%,rgba(14,9,6,.35) 45%,rgba(14,9,6,0) 70%)}
.slide .cap{position:absolute;z-index:2;inset-inline:0;bottom:0;padding:22px clamp(18px,4vw,40px) 46px;display:grid;gap:8px}
.slide .cap small{font-size:12px;letter-spacing:.24em;color:var(--accent2)}
.slide .cap h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,58px);line-height:1.02;text-wrap:balance}
.slide .cap p{margin:0;color:#dccab0;max-width:46ch}
.slide .cap .btn{justify-self:start;margin-top:6px}
.dots{position:absolute;z-index:3;bottom:18px;inset-inline-start:clamp(18px,4vw,40px);display:flex;gap:6px}
.dots button{width:18px;height:3px;border-radius:3px;border:0;background:rgba(255,236,210,.3);padding:0;transition:width .4s,background .4s}
.dots button.on{background:var(--accent);width:38px}
@media (max-width:600px){.hero{aspect-ratio:4/5}}
/* ready + closed */
.ready{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(120deg,#2b3820,#1f2a17);border:1px solid var(--ok);border-radius:20px;padding:18px 20px;margin-bottom:16px}
.ready .ic{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ok);display:grid;place-items:center;font-family:var(--display);font-size:26px;color:#e4f5cc;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(156,191,107,0)}0%{box-shadow:0 0 0 0 rgba(156,191,107,.45)}}
.ready h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,4.6vw,30px);color:#e4f5cc}
.ready p{margin:4px 0 0;color:#cfe3b3}
.closed{border:1px solid var(--danger);border-radius:16px;padding:14px 16px;margin-bottom:16px}
/* my orders */
.mine{margin-top:18px;display:grid;gap:10px}
.mine h3{margin:0;font-family:var(--display);font-weight:700;font-size:22px}
.o{border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:10px;background:rgba(37,26,19,.55)}
.o .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.o .items{color:var(--muted);font-size:14px}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.track i{height:3px;border-radius:3px;background:var(--surface2)}
.track i.on{background:var(--accent)}
.track.done i{background:var(--ok)}
.tlabels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center}
.st{font-weight:700;font-size:14px}
.link{border:0;background:none;color:var(--accent2);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:0}
/* categories */
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 80%,transparent);padding-block:14px;margin-top:22px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;padding:8px 12px;font-weight:600;font-size:15px;transition:color .2s,border-color .2s}
.cats a.on{color:var(--fg);border-color:var(--accent)}
section.cat{padding-top:30px;scroll-margin-top:70px}
.cat-h{display:grid;gap:2px;margin-bottom:18px;text-align:center}
.cat-h h3{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,46px);line-height:1.05;margin:0}
.cat-h small{color:var(--muted);letter-spacing:.2em;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{display:grid;grid-template-rows:auto 1fr;gap:12px;min-width:0}
.card .ph{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:18px;overflow:hidden;background:var(--surface)}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
@media (hover:hover){.card:hover .ph img{transform:scale(1.05)}}
.card.has .ph{outline:2px solid var(--accent);outline-offset:3px}
.card.out{opacity:.45}
.qbadge{position:absolute;top:10px;inset-inline-start:10px;background:var(--accent);color:#2a1806;font-weight:800;border-radius:999px;min-width:30px;height:30px;display:grid;place-items:center;padding:0 8px;font-size:15px}
.soldtag{position:absolute;top:10px;inset-inline-end:10px;background:rgba(14,9,6,.8);color:var(--fg);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px}
.card .body{display:grid;gap:6px;align-content:start}
.card .tt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h4{margin:0;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15}
.sku{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card p{margin:0;color:var(--muted);font-size:14px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;justify-self:start}
.step{margin-top:6px}
.step .add{width:100%;border:1px solid var(--accent);border-radius:999px;padding:11px;background:transparent;color:var(--accent2);font-weight:700;font-size:15px;transition:background .2s,color .2s}
.step .add:hover{background:var(--accent);color:#2a1806}
.step .add:disabled{border-color:var(--line);color:var(--muted)}
.step .q{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--accent);border-radius:999px;padding:3px}
.step .q button{width:40px;height:38px;border-radius:999px;border:0;background:var(--accent);color:#2a1806;font-size:20px;font-weight:800}
.step .q b{font-size:17px;font-variant-numeric:tabular-nums}
/* custom request */
.special{border:1px dashed var(--line);border-radius:20px;padding:20px;display:grid;gap:12px;text-align:center;justify-items:center}
.special h3{margin:0;font-family:var(--display);font-weight:700;font-size:28px}
.special-row{display:flex;gap:8px;flex-wrap:wrap;width:100%;max-width:560px}
input.f,textarea.f{flex:1;min-width:0;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px}
input.f:focus,textarea.f:focus{border-color:var(--accent);outline:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.chips button{border:0;background:none;color:var(--muted);font-size:15px;padding:0}
/* dock & drawer */
.dock{position:fixed;inset-inline:0;bottom:0;z-index:40;display:flex;gap:10px;justify-content:center;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,var(--bg) 45%)}
.cartbtn{flex:1;max-width:440px;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:999px;padding:15px 22px;background:var(--accent);color:#2a1806;font-weight:800;font-size:16px;box-shadow:0 14px 40px -10px rgba(227,163,59,.5)}
.cartbtn:disabled{background:var(--surface2);color:var(--muted);box-shadow:none}
.cartbtn .n{background:#2a1806;color:var(--accent2);border-radius:999px;padding:1px 10px;margin-inline-end:8px}
.callbtn{border:1px solid var(--line);border-radius:999px;padding:0 18px;background:var(--surface);color:var(--fg);font-weight:700;font-size:15px;white-space:nowrap}
.callbtn.ringing{border-color:var(--accent2);color:var(--accent2)}
.bump{animation:bump .35s}@keyframes bump{50%{transform:scale(1.04)}}
.scrim{position:fixed;inset:0;background:rgba(10,6,3,.7);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:60;inset-inline:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;max-width:640px;margin-inline:auto;border-top:1px solid var(--line);
  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.drawer.show{transform:none}
.drawer h2{font-family:var(--display);font-weight:700;font-size:30px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.x{background:var(--surface2);border:0;color:var(--fg);width:38px;height:38px;border-radius:50%;font-size:16px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:11px;border-bottom:1px solid var(--line)}
.line .q{display:flex;align-items:center;gap:10px;flex:none}
.line .q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);font-size:17px}
.fl{display:grid;gap:6px;margin-top:14px}
.fl label{font-weight:700;font-size:14px}
.fl .row2{display:flex;gap:8px}
.noTable{min-height:70vh;display:grid;place-items:center;text-align:center}
.noTable div{display:grid;gap:14px;justify-items:center;max-width:420px}
.loading{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="rule">מטבח ביתי</div>
    <div class="logo">האוכל של <span>אורן</span></div>
    <span class="tablechip" id="tableChip" hidden>שולחן <b id="tn"></b><span id="who"></span></span>
  </header>

  <div id="noTable" class="noTable" hidden><div>
    <h1 class="h-display" style="font-size:clamp(34px,7vw,54px);font-weight:700">סרקו את הברקוד שעל השולחן</h1>
    <p class="muted">לכל שולחן יש ברקוד משלו. סורקים אותו ומזמינים ישר מהטלפון.</p>
  </div></div>

  <div id="store" hidden>
    <div id="readyBox"></div>
    <div id="closedBox"></div>
    <div class="hero" id="hero"></div>
    <div class="mine" id="mine"></div>
    <nav class="cats" id="cats" aria-label="קטגוריות"></nav>
    <main id="menu"><p class="loading">טוען את התפריט...</p></main>
    <section class="cat" id="custom">
      <div class="special">
        <h3>משהו שלא בתפריט?</h3>
        <p class="muted" style="margin:0">כתבו מה תרצו, והמטבח יכין אם אפשר.</p>
        <div class="special-row">
          <input class="f" id="customName" maxlength="60" placeholder="לדוגמה: שקשוקה, סלט ירקות, תה עם נענע" autocomplete="off">
          <button class="btn" type="button" id="addCustom">הוספה להזמנה</button>
        </div>
        <div class="chips" id="customList"></div>
      </div>
    </section>
    <p class="muted" style="text-align:center;font-size:12px;margin-top:34px">ללא תשלום · אוכלים במקום · התמונות להמחשה</p>
  </div>
</div>

<div class="dock" id="dock" hidden>
  <button class="cartbtn" id="openCart" type="button" disabled><span><span class="n" id="cnt">0</span>ההזמנה שלי</span><span>לשליחה</span></button>
  <button class="callbtn" id="callBtn" type="button">קריאה למלצר</button>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="ההזמנה שלי"></aside>
<div class="toast" id="toast" role="status"></div>

<script src="/common.js"></script>
<script>
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
let table = Number(qs.get("t"));
if (!TABLES.includes(table)) table = null;
// A staff phone that scans a table QR opens that table in the panel instead (not for receipt QRs).
if (table && !qs.get("o") && isStaff()) location.replace("/admin?t=" + table);

const cart = {};
const KEY = "mine-" + table;
let mine = []; try { mine = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch {}
// An order made at the register comes with ?o=<id>: follow it on this phone
const fromPos = qs.get("o");
if (fromPos && table) {
  if (!mine.includes(fromPos)) mine.push(fromPos);
  try { localStorage.setItem(KEY, JSON.stringify(mine.slice(-20))); } catch {}
  history.replaceState(null, "", "/?t=" + table);
}
let myName = ""; try { myName = localStorage.getItem("name") || ""; } catch {}
let settings = { open: true, soldOut: [] };
const seenReady = new Set(); try { JSON.parse(localStorage.getItem("seenReady") || "[]").forEach(x => seenReady.add(x)); } catch {}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("show"), 3200); }
document.addEventListener("pointerdown", unlockSound, { once: true });
const setWho = () => { $("#who").textContent = myName ? " · " + myName : ""; };

if (!table) { $("#noTable").hidden = false; }
else {
  $("#store").hidden = false; $("#dock").hidden = false; $("#tableChip").hidden = false; $("#tn").textContent = table; setWho();
  document.title = "שולחן " + table + " · האוכל של אורן";
}

const pic = (i, cls = "") => i.img ? `<img class="${cls}" src="${imgUrl(i)}" alt="${esc(i.n)}" loading="lazy">` : monogram(i.n);

// hero: dishes marked as signature
let cur = 0, timer;
function renderHero() {
  const stars = Object.values(ITEMS).filter(i => i.star).sort((a, b) => (b.img ? 1 : 0) - (a.img ? 1 : 0));
  if (!stars.length) { $("#hero").hidden = true; return; }
  $("#hero").innerHTML = stars.map((s, k) => `<div class="slide${k ? "" : " on"}">${pic(s)}
    <div class="cap"><small>מנות הבית</small><h2>${esc(s.n)}</h2>${s.d ? `<p>${esc(s.d)}</p>` : ""}
    <button class="btn" data-plus="${s.id}" type="button">הוספה להזמנה</button></div></div>`).join("") +
    `<div class="dots">${stars.map((_, k) => `<button type="button" aria-label="מנה ${k + 1}" class="${k ? "" : "on"}" data-go="${k}"></button>`).join("")}</div>`;
  cur = 0;
  const go = k => { const sl = document.querySelectorAll(".slide"), d = document.querySelectorAll(".dots button");
    sl[cur].classList.remove("on"); d[cur].classList.remove("on"); cur = (k + stars.length) % stars.length; sl[cur].classList.add("on"); d[cur].classList.add("on"); };
  const auto = () => { clearInterval(timer); timer = setInterval(() => go(cur + 1), 5500); };
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { go(+b.dataset.go); auto(); });
  let sx = null; $("#hero").ontouchstart = e => sx = e.touches[0].clientX;
  $("#hero").ontouchend = e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(cur + (dx > 0 ? 1 : -1)); sx = null; auto(); };
  auto();
}

// menu
const isOut = id => settings.soldOut.includes(id);
const stepper = id => isOut(id) ? `<button class="add" type="button" disabled>נגמר להיום</button>`
  : cart[id] ? `<div class="q"><button type="button" data-minus="${id}" aria-label="פחות">−</button><b>${cart[id]}</b><button type="button" data-plus="${id}" aria-label="עוד">+</button></div>`
  : `<button class="add" type="button" data-plus="${id}">הוספה להזמנה</button>`;
function renderMenu() {
  $("#cats").innerHTML = MENU.filter(c => c.items.length).map((c, k) => `<a href="#${c.id}" class="${k ? "" : "on"}">${esc(c.name)}</a>`).join("") + `<a href="#custom">משהו אחר</a>`;
  $("#menu").innerHTML = MENU.filter(c => c.items.length).map(c => `<section class="cat" id="${c.id}"><div class="cat-h"><small>${esc(c.sub || "")}</small><h3>${esc(c.name)}</h3></div>
  <div class="grid">${c.items.map(i => `<article class="card ${cart[i.id] ? "has" : ""} ${isOut(i.id) ? "out" : ""}" id="card-${i.id}">
    <div class="ph">${pic(i)}${cart[i.id] ? `<span class="qbadge">${cart[i.id]}</span>` : ""}${isOut(i.id) ? '<span class="soldtag">נגמר להיום</span>' : ""}</div>
    <div class="body"><div class="tt"><h4>${esc(i.n)}</h4><span class="sku">מס׳ ${i.sku}</span></div>
    ${i.d ? `<p>${esc(i.d)}</p>` : ""}${i.tag ? `<span class="tag">${esc(i.tag)}</span>` : ""}
    <div class="step" id="st-${i.id}">${stepper(i.id)}</div></div></article>`).join("")}</div></section>`).join("");
  const links = [...document.querySelectorAll("#cats a")];
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll("section.cat").forEach(s => io.observe(s));
}

// cart
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
function change(id, d) {
  if (d > 0 && isOut(id)) return;
  cart[id] = Math.max(0, (cart[id] || 0) + d); if (!cart[id]) delete cart[id];
  const card = document.getElementById("card-" + id);
  if (card) {
    card.classList.toggle("has", !!cart[id]);
    document.getElementById("st-" + id).innerHTML = stepper(id);
    const ph = card.querySelector(".ph"), qb = ph.querySelector(".qbadge");
    if (cart[id]) { if (qb) qb.textContent = cart[id]; else ph.insertAdjacentHTML("beforeend", `<span class="qbadge">${cart[id]}</span>`); } else if (qb) qb.remove();
  }
  $("#cnt").textContent = count(); $("#openCart").disabled = !count();
  if (d > 0) { const b = $("#openCart"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
  if ($("#drawer").classList.contains("show")) renderCart();
  renderCustom();
}
document.addEventListener("click", e => {
  const p = e.target.closest("[data-plus]"), m = e.target.closest("[data-minus]"), r = e.target.closest("[data-receipt]");
  if (p) change(p.dataset.plus, 1); else if (m) change(m.dataset.minus, -1);
  else if (r) { const o = lastMine.find(x => x.id === r.dataset.receipt); o && showReceipt(o); }
});

// requests that are not on the menu
let customN = 0;
function addCustomText(n) {
  n = String(n || "").trim().replace(/\s+/g, " ");
  if (!n) { toast("כתבו קודם מה תרצו להזמין"); return false; }
  const existing = Object.values(ITEMS).find(i => i.custom && i.n === n);
  const id = existing ? existing.id : "c" + (++customN);
  if (!existing) ITEMS[id] = { id, n, custom: true };
  change(id, 1); toast(`"${n}" נוסף להזמנה`); return true;
}
function renderCustom() {
  $("#customList").innerHTML = Object.keys(cart).filter(id => ITEMS[id] && ITEMS[id].custom)
    .map(id => `<span>${esc(ITEMS[id].n)} ×${cart[id]} <button type="button" data-minus="${id}" aria-label="הסרה">✕</button></span>`).join("");
}
$("#addCustom").onclick = () => { if (addCustomText($("#customName").value)) $("#customName").value = ""; };
$("#customName").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#addCustom").click(); } });

const close = () => { $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); };
$("#openCart").onclick = () => { renderCart(); $("#drawer").classList.add("show"); $("#scrim").classList.add("show"); };
$("#scrim").onclick = close;
function renderCart() {
  const ids = Object.keys(cart);
  if (!ids.length) return close();
  const keep = id => $("#" + id) ? $("#" + id).value : "";
  const note = keep("note"), nm = $("#nm") ? $("#nm").value : myName, extra = keep("extra");
  $("#drawer").innerHTML = `<h2>ההזמנה לשולחן ${table} <button class="x" id="cx" type="button" aria-label="סגירה">✕</button></h2>
  ${ids.map(id => `<div class="line"><span>${esc(ITEMS[id].n)}${ITEMS[id].custom ? ' <span class="tag">מחוץ לתפריט</span>' : ` <span class="sku">מס׳ ${ITEMS[id].sku}</span>`}</span><div class="q">
    <button type="button" data-minus="${id}" aria-label="פחות">−</button><b>${cart[id]}</b><button type="button" data-plus="${id}" aria-label="עוד">+</button></div></div>`).join("")}
  <div class="fl"><label for="extra">עוד משהו שאין בתפריט?</label><div class="row2"><input class="f" id="extra" maxlength="60" placeholder="כתבו כאן ולחצו הוספה" value="${esc(extra)}"><button class="btn ghost" type="button" id="addExtra">הוספה</button></div></div>
  <div class="fl"><label for="nm">השם שלך <span class="muted">(חובה)</span></label><input class="f" id="nm" maxlength="30" autocomplete="given-name" value="${esc(nm)}" placeholder="לדוגמה: דנה"></div>
  <div class="fl"><label for="note">הערות למטבח</label><textarea class="f" id="note" rows="2" placeholder="בלי בצל, רוטב בצד...">${esc(note)}</textarea></div>
  <p class="err" id="er"></p>
  <button class="btn big" id="send" type="button" style="width:100%">שליחה למטבח</button>`;
  $("#cx").onclick = close;
  const addExtra = () => { if (addCustomText($("#extra").value)) { $("#extra").value = ""; renderCart(); } };
  $("#addExtra").onclick = addExtra;
  $("#extra").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addExtra(); } });
  $("#send").onclick = async () => {
    const name = $("#nm").value.trim();
    if (name.length < 2) { $("#er").textContent = "כתבו את השם שלכם כדי שנדע למי להגיש."; $("#nm").focus(); return; }
    if ($("#extra").value.trim()) addCustomText($("#extra").value);
    const btn = $("#send"); btn.disabled = true; btn.textContent = "שולח...";
    try {
      const items = Object.keys(cart).map(id => ({ id, n: ITEMS[id].n, q: cart[id], c: !!ITEMS[id].custom }));
      const { order } = await api("/api/order", { table, name, items, note: $("#note").value });
      myName = name; setWho(); try { localStorage.setItem("name", name); } catch {}
      mine.push(order.id); try { localStorage.setItem(KEY, JSON.stringify(mine.slice(-20))); } catch {}
      Object.keys(cart).forEach(id => { delete cart[id]; change(id, 0); });
      close(); showReceipt(order); toast(`הזמנה מספר ${order.num} נשלחה למטבח`); poll();
    } catch (e) { $("#er").textContent = e.message; btn.disabled = false; btn.textContent = "שליחה למטבח"; }
  };
}

// call the waiter
$("#callBtn").onclick = async () => {
  const b = $("#callBtn"); b.disabled = true; b.classList.add("ringing"); b.textContent = "המלצר בדרך";
  try { const r = await api("/api/call", { table, name: myName }); toast(r.already ? "כבר קראנו למלצר, הוא בדרך" : "המלצר קיבל הודעה ומגיע"); }
  catch (e) { toast(e.message); }
  setTimeout(() => { b.disabled = false; b.classList.remove("ringing"); b.textContent = "קריאה למלצר"; }, 8000);
};

// live: open/sold-out and the status of this phone's orders
const STEP = { new: 1, cooking: 2, ready: 3, served: 4 };
let lastMine = [];
async function poll() {
  if (!table) return;
  try {
    const s = (await api("/api/settings")).settings;
    const changed = JSON.stringify(s) !== JSON.stringify(settings);
    settings = s;
    if (changed && MENU.length) { Object.keys(cart).forEach(id => { if (isOut(id)) delete cart[id]; }); renderMenu(); change("_", 0); }
    $("#closedBox").innerHTML = settings.open ? "" : `<div class="closed"><b>המטבח סגור כרגע.</b> <span class="muted">אפשר לעיין בתפריט, ההזמנות ייפתחו מחדש בקרוב.</span></div>`;
  } catch {}
  if (!mine.length) return;
  try {
    const { orders } = await api("/api/order?ids=" + mine.join(","));
    lastMine = orders;
    if (!myName && orders.length) { myName = orders[orders.length - 1].name || ""; setWho(); }
    const ready = orders.filter(o => o.status === "ready");
    ready.forEach(o => { if (!seenReady.has(o.id)) { seenReady.add(o.id); beep("ready"); } });
    try { localStorage.setItem("seenReady", JSON.stringify([...seenReady].slice(-30))); } catch {}
    $("#readyBox").innerHTML = ready.map(o => `<div class="ready" role="alert"><div class="ic">${o.num}</div><div>
      <h2>ההזמנה שלך מוכנה</h2><p>נא לגשת לאסוף מהדלפק, או לחכות למלצר שיביא אותה לשולחן ${o.table}.</p></div></div>`).join("");
    const live = orders.filter(o => !o.tableClosed).reverse();
    $("#mine").innerHTML = live.length ? `<h3>ההזמנות שלך</h3>` + live.map(o => {
      const done = o.status === "served";
      return `<div class="o"><div class="row"><span><b>הזמנה ${o.num}</b> · ${esc(o.name || "")}</span>
      <span style="display:flex;gap:12px;align-items:center"><span class="st" style="color:${STATUS[o.status].c}">${done ? "בתיאבון" : STATUS[o.status].t}</span><button type="button" class="link" data-receipt="${o.id}">חשבונית</button></span></div>
      <div class="items">${o.items.map(i => esc(i.n) + (i.q > 1 ? " ×" + i.q : "")).join(" · ")}</div>
      ${o.status === "cancelled" ? "" : `<div class="track ${done ? "done" : ""}">${[1, 2, 3, 4].map(n => `<i class="${STEP[o.status] >= n ? "on" : ""}"></i>`).join("")}</div>
      <div class="tlabels"><span>התקבלה</span><span>בהכנה</span><span>מוכנה</span><span>הוגשה</span></div>`}</div>`; }).join("") : "";
  } catch {}
}

(async () => {
  if (!table) return;
  try { await loadMenu(); renderHero(); renderMenu(); }
  catch (e) { $("#menu").innerHTML = `<p class="loading">התפריט לא נטען (${esc(e.message)}). רעננו את הדף.</p>`; }
  poll(); setInterval(poll, 4000);
})();
</script>
</body>
</html>
